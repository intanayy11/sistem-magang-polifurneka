<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Magang Polifurneka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-poli { width: 100%; padding: 0.75rem 1rem; border-radius: 0.5rem; border: 1px solid #e2e8f0; background-color: #f8fafc; transition: all 0.2s; outline: none; }
        .input-poli:focus { border-color: #fbbf24; background-color: #fff; box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1); }
        .btn-poli-primary { background-color: #E8A800; color: #fff; font-weight: 600; padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; cursor: pointer; transition: background-color 0.2s; }
        .btn-poli-primary:hover { background-color: #d97706; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl flex overflow-hidden border border-slate-100 min-h-[500px]">
        <!-- Kiri: Logo & Info -->
        <div class="w-2/5 bg-slate-900 p-10 flex flex-col justify-between text-white relative overflow-hidden">
            <div class="absolute -right-20 -top-20 w-64 h-64 bg-amber-500 rounded-full blur-3xl opacity-20"></div>
            <div>
                <div class="w-16 h-16 bg-amber-500 rounded-xl flex items-center justify-center text-3xl font-bold shadow-lg mb-8 text-white">P</div>
                <h1 class="text-3xl font-bold mb-2">Portal Magang</h1>
                <p class="text-slate-400 text-sm leading-relaxed">Sistem Informasi Presensi, Logbook & Tugas Magang Terpadu.</p>
            </div>
            <div class="text-xs text-slate-500">© 2026 Polifurneka Kendal</div>
        </div>

        <!-- Kanan: Form Login -->
        <div class="w-3/5 p-10 bg-white flex flex-col justify-center">
            <div class="max-w-md w-full mx-auto">
                <h2 class="text-2xl font-bold text-slate-900 mb-1">Masuk ke Akun Anda</h2>
                <p class="text-slate-500 text-sm mb-8">Silakan masukkan email dan password Anda.</p>
                
                <form class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Alamat Email</label>
                        <input type="email" class="input-poli" placeholder="nama@email.com" value="peserta@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                        <input type="password" class="input-poli" placeholder="••••••••" value="password">
                    </div>
                    <button type="button" class="w-full btn-poli-primary mt-4">MASUK KE PORTAL</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
